meta:
  environment: node                   # 👈 environment: node, а не nodejs
  toolchain:
    name: npm
    version: "20"
build:
  additionalCommands: npm install     # или npm ci для более строгой установки
run:
  command: npm run start              # 👈 Основная команда запуска вашего сервера
  containerPort: 3000                 # 👈 Порт из вашего кода
