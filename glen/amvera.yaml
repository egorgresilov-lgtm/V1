---
meta:
  environment: node
  toolchain:
    name: npm
    version: 18

build:
  additionalCommands: npm install --production

run:
  command: npm run start
  containerPort: 3000    # Порт, который слушает Node.js приложение
  servicePort: 80        # Порт, на который будут приходить внешние запросы
