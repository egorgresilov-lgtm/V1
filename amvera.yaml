meta:
  environment: nodejs
  toolchain:
    name: npm
    version: "20"

build:
  additionalCommands: npm install

run:
  command: npm run start
  containerPort: 3000

env:
  - name: NODE_ENV
    value: production
  - name: PORT
    value: "3000"
  - name: FRONTEND_URL
    value: "http://localhost:3000"
  - name: JWT_ACCESS_SECRET
    value: "production_secret_key_change_me"
  - name: JWT_REFRESH_SECRET
    value: "production_refresh_secret_change_me"
  - name: JWT_ACCESS_EXPIRY
    value: "15m"
  - name: JWT_REFRESH_EXPIRY
    value: "7d"