---
meta:
  environment: "Node.js"
  toolchain: "node.js-18"
  name: "glen"
  description: "Buryatia Tourism Application"

build:
  workDir: ./glen
  installDependencies:
    - npm install --production

run:
  - npm start

env:
  NODE_ENV: production
  PORT: 3000

ports:
  - port: 3000
    protocol: HTTP
